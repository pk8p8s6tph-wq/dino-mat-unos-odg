<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>DINO - TASTATURA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FFCDD2;font-family:-apple-system,Arial;display:flex;justify-content:center;overflow:hidden}
#game{width:375px;max-width:100vw;height:100dvh;background:white;display:flex;flex-direction:column;padding:10px;position:relative}
#top{display:flex;justify-content:space-between;background:#FFF9C4;padding:10px 14px;border-radius:12px;font-weight:bold;font-size:18px}
#dinoArea{text-align:center;height:155px}#dinoSvg{width:135px;height:135px}
#ime{font-weight:900;font-size:17px}
#pitanje{font-size:52px;font-weight:900;text-align:center;margin:6px 0}
#unosBox{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
#unos{width:90px;height:58px;font-size:38px;font-weight:900;text-align:center;border:3px solid #C62828;border-radius:14px;background:#FFEBEE;line-height:52px}
#tastatura{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;padding-bottom:6px}
.tipka{padding:16px 0;font-size:28px;font-weight:800;border-radius:14px;border:3px solid #C62828;background:white}
.tipka:active{transform:scale(0.94);background:#C62828;color:white}
.tipka.del{background:#FFEBEE}.tipka.ok{background:#C62828;color:white}
#nagrada{text-align:center;font-size:26px;min-height:36px;font-weight:900}
#confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.skok{animation:skok .7s ease}@keyframes skok{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-38px) scale(1.35)}100%{transform:translateY(0) scale(1)}}
.tres{animation:tres .4s}@keyframes tres{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.back{display:inline-block;text-decoration:none;background:#eee;padding:6px 12px;border-radius:8px;font-size:13px;color:#333}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} 
.blink{animation:blink 3s infinite;transform-origin:center}.float{animation:float 1.2s ease-in-out infinite}
</style>
</head>
<body>
<div id="game"><canvas id="confetti"></canvas><a class="back" href="./index.html">← Nazad</a>
<div id="top"><span id="bod">⭐ 0</span><span id="jaja">🥚 0</span></div>
<div id="dinoArea"><div id="dinoHolder"></div><div id="ime">T-REX</div></div>
<div id="pitanje"></div>
<div id="unosBox"><div id="unos"></div><span style="font-size:32px">?</span></div>
<div id="nagrada"></div>
<div id="tastatura">
<button class="tipka" onclick="dodaj(1)">1</button><button class="tipka" onclick="dodaj(2)">2</button><button class="tipka" onclick="dodaj(3)">3</button>
<button class="tipka" onclick="dodaj(4)">4</button><button class="tipka" onclick="dodaj(5)">5</button><button class="tipka" onclick="dodaj(6)">6</button>
<button class="tipka" onclick="dodaj(7)">7</button><button class="tipka" onclick="dodaj(8)">8</button><button class="tipka" onclick="dodaj(9)">9</button>
<button class="tipka del" onclick="obrisi()">⌫</button><button class="tipka" onclick="dodaj(0)">0</button><button class="tipka ok" onclick="provjeri()">OK</button>
</div></div>
<script>
const dinos=[
{name:"T-REX",color:"#C62828",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="62" r="27" fill="#EF9A9A" stroke="#C62828" stroke-width="2"/><circle cx="50" cy="34" r="18" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/><g class="blink"><circle cx="42" cy="30" r="5.5" fill="white" stroke="black"/><circle cx="58" cy="30" r="5.5" fill="white" stroke="black"/><circle cx="42" cy="31.5" r="2" fill="black"/><circle cx="58" cy="31.5" r="2" fill="black"/></g></g></svg>`},
{name:"BRONTO",color:"#1565C0",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="70" rx="29" ry="19" fill="#90CAF9" stroke="#1565C0" stroke-width="2"/><circle cx="52" cy="34" r="17" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/></g></svg>`},
{name:"TRICE",color:"#6A1B9A",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="66" rx="27" ry="18" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2"/><circle cx="50" cy="38" r="20" fill="#E1BEE7" stroke="#6A1B9A" stroke-width="2"/></g></svg>`},
{name:"STEGO",color:"#EF6C00",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="68" rx="28" ry="18" fill="#FFCC80" stroke="#EF6C00" stroke-width="2"/><circle cx="50" cy="38" r="17" fill="#FFE0B2" stroke="#EF6C00" stroke-width="2"/></g></svg>`},
{name:"PTERO",color:"#00838F",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="56" r="18" fill="#80DEEA" stroke="#00838F" stroke-width="2"/><circle cx="50" cy="36" r="13" fill="#B2EBF2" stroke="#00838F" stroke-width="2"/></g></svg>`},
{name:"RAPTOR",color:"#C62828",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="60" r="23" fill="#EF5350" stroke="#C62828" stroke-width="2"/><circle cx="50" cy="33" r="16" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/></g></svg>`},
{name:"DIPLO",color:"#2E7D32",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="72" rx="27" ry="15" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/><circle cx="50" cy="38" r="15" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/></g></svg>`},
{name:"PARA",color:"#0D47A1",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><circle cx="50" cy="62" r="25" fill="#64B5F6" stroke="#0D47A1" stroke-width="2"/><circle cx="50" cy="36" r="17" fill="#BBDEFB" stroke="#0D47A1" stroke-width="2"/></g></svg>`},
{name:"SPINO",color:"#E65100",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="65" rx="25" ry="17" fill="#FFB74D" stroke="#E65100" stroke-width="2"/><circle cx="50" cy="38" r="14" fill="#FFE0B2" stroke="#E65100" stroke-width="2"/></g></svg>`},
{name:"ANKY",color:"#5D4037",svg:`<svg id="dinoSvg" viewBox="0 0 100 100"><g class="float"><ellipse cx="50" cy="68" rx="31" ry="19" fill="#A1887F" stroke="#5D4037" stroke-width="2"/><circle cx="50" cy="40" r="16" fill="#D7CCC8" stroke="#5D4037" stroke-width="2"/></g></svg>`}
];
let idx=0,bod=0,jaja=0,aCtx,tacno=0,unosStr="";const conf=document.getElementById('confetti');const cCtx=conf.getContext('2d');conf.width=375;conf.height=600;
function zvukTacno(){try{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();let t=aCtx.currentTime;[523,659,784,1046].forEach((f,i)=>{let o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);o.frequency.value=f;g.gain.setValueAtTime(.28,t+i*.11);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.45);o.start(t+i*.11);o.stop(t+i*.11+.45);});}catch(e){}}
function zvukNetacno(){try{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();let t=aCtx.currentTime;let o=aCtx.createOscillator(),g=aCtx.createGain();o.connect(g);g.connect(aCtx.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(70,t+.45);g.gain.setValueAtTime(.4,t);g.gain.linearRampToValueAtTime(0.01,t+.5);o.start(t);o.stop(t+.5);}catch(e){}}
function konfete(){let p=[];for(let i=0;i<110;i++) p.push({x:187,y:210,vx:(Math.random()-0.5)*10,vy:Math.random()*-11-3,r:Math.random()*5+3,c:`hsl(${Math.random()*360},100%,50%)`,life:105});let id=setInterval(()=>{cCtx.clearRect(0,0,conf.width,conf.height);p.forEach(o=>{o.x+=o.vx;o.vy+=0.28;o.y+=o.vy;o.life--;cCtx.fillStyle=o.c;cCtx.fillRect(o.x,o.y,o.r,o.r);});p=p.filter(o=>o.life>0&&o.y<900);if(!p.length) clearInterval(id);},16);}
function postavi(i){document.getElementById('dinoHolder').innerHTML=dinos[i].svg;document.getElementById('ime').innerText=dinos[i].name;document.getElementById('ime').style.color=dinos[i].color;}
function novo(){let a=Math.floor(Math.random()*10)+1;let b=Math.floor(Math.random()*a)+1;tacno=a-b;document.getElementById('pitanje').innerText=`${a} - ${b} =`;unosStr="";document.getElementById('unos').innerText="";}
function dodaj(n){if(unosStr.length<2){unosStr+=n;document.getElementById('unos').innerText=unosStr;}}
function obrisi(){unosStr=unosStr.slice(0,-1);document.getElementById('unos').innerText=unosStr;}
function provjeri(){if(unosStr==="") return;let k=parseInt(unosStr);if(k===tacno){bod++;zvukTacno();konfete();let d=document.getElementById('dinoHolder');d.classList.remove('skok');void d.offsetWidth;d.classList.add('skok');document.getElementById('nagrada').innerText='🎉 BRAVO! 🎉';if(bod%5==0){jaja++;document.getElementById('nagrada').innerText='🥚 NOVI DINO!';}setTimeout(()=>{idx=(idx+1)%dinos.length;postavi(idx);document.getElementById('nagrada').innerText='';d.classList.remove('skok');novo();},1100);}else{zvukNetacno();if(jaja>0) jaja--;let d=document.getElementById('dinoHolder');d.classList.remove('tres');void d.offsetWidth;d.classList.add('tres');document.getElementById('nagrada').innerText=`💔 Tačno je ${tacno}`;setTimeout(()=>{document.getElementById('nagrada').innerText='';d.classList.remove('tres');unosStr="";document.getElementById('unos').innerText="";},1300);}document.getElementById('bod').innerText=`⭐ ${bod}`;document.getElementById('jaja').innerText=`🥚 ${jaja}`;}
postavi(0);novo();document.body.addEventListener('touchstart',()=>{if(!aCtx) aCtx=new(window.AudioContext||window.webkitAudioContext)();},{once:true});
</script></body></html>
