<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Matematika - iPad Final</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#A5D6A7;display:flex;justify-content:center;min-height:100dvh;transition:.3s}
body.oduzimanje{background:#FFCDD2}
#app{width:100%;max-width:440px;background:#fff;margin:8px;border-radius:24px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.15);display:flex;flex-direction:column}
.top{display:flex;gap:8px;padding:12px}
.top button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:900;font-size:16px;cursor:pointer}
.top .active{color:#fff} #sabBtn.active{background:#2E7D32} #oduBtn.active{background:#C62828} #sabBtn,#oduBtn{background:#eee}
.stats{display:flex;justify-content:space-around;font-weight:800;padding:6px 12px}
#dinoWrap{display:flex;justify-content:center;padding:8px}
#dinoSprite{width:170px;height:170px;background:#f6f6f6;border-radius:20px;border:3px solid #eee;overflow:hidden;position:relative}
#dinoImg{position:absolute;width:500%;height:200%;left:0;top:0;display:block}
#dinoFallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:80px}
#zad{font-size:44px;font-weight:900;text-align:center;margin:4px 0}
#brojalica{text-align:center;font-size:32px;min-height:44px;padding:4px 8px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;align-items:center}
#brojalica span{cursor:pointer;padding:4px 2px;border-radius:10px;transition:.2s;user-select:none;display:inline-block;min-width:28px}
#brojalica span.counted{background:#C8E6C9;transform:scale(1.25);box-shadow:0 2px 6px rgba(0,0,0,.2)}
#brojalica span.crossed{opacity:.35;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#C62828}
#brojalica .op{font-size:24px;font-weight:900;margin:0 4px;color:#555}
#scribbleBox{margin:12px;border:3px solid #2E7D32;border-radius:18px;padding:12px;background:#F1F8E9}
#scribbleBox label{font-weight:800;color:#2E7D32;display:block;margin-bottom:8px;font-size:14px}
#scribbleInput{width:100%;height:84px;font-size:52px;font-weight:900;text-align:center;border:3px dashed #90A4AE;border-radius:14px;background:#fff;outline:none;caret-color:transparent;color:#212121}
#scribbleInput::selection{background:transparent}
#scribbleInput:focus{outline:none;border-color:#2E7D32}
#scribbleHint{font-size:12px;color:#666;text-align:center;margin-top:6px}
#unosBox{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px}
#unos{width:90px;height:62px;border:3px solid #2E7D32;border-radius:14px;text-align:center;font-size:32px;font-weight:900;line-height:56px;background:#fff}
#msg{text-align:center;font-weight:800;min-height:26px;font-size:15px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.keypad button{height:62px;border-radius:16px;border:0;background:#F1F8E9;font-size:26px;font-weight:800;box-shadow:0 2px 0 #AED581;cursor:pointer}
.keypad button:active{transform:scale(.96)}
#okBtn{background:#2E7D32!important;color:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}} .shake{animation:shake .3s}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}} .bounce{animation:bounce .4s}
</style>
</head>
<body>
<div id="app">
<div class="top"><button id="sabBtn" class="active">➕ SABIRANJE</button><button id="oduBtn">➖ ODUZIMANJE</button></div>
<div class="stats"><span>⭐ <b id="bod">0</b></span><span>🥚 <b id="jaja">0</b></span><span>🦕 <b id="kol">0</b>/240</span></div>
<div id="dinoWrap"><div id="dinoSprite"><img id="dinoImg" alt=""><div id="dinoFallback">🦕</div></div></div>
<div id="zad">3 + 2 = ?</div>
<div id="brojalica"></div>
<div id="scribbleBox">
<label>✏️ Piši olovkom ovdje:</label>
<input id="scribbleInput" type="text" inputmode="numeric" lang="sr" autocomplete="off" autocorrect="off" spellcheck="false">
<div id="scribbleHint">Zadaci 0-10 - vidi se broj dole odmah</div>
</div>
<div id="unosBox"><div id="unos"></div><div id="msg"></div></div>
<div class="keypad">
<button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
<button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
<button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
<button id="delBtn">⌫</button><button data-v="0">0</button><button id="okBtn">OK</button>
</div>
</div>
<script>
const SPRITES=['./dino1.png','./dino2.png','./dino3.png','./dino4.png','./dino5.png','./dino6.png','./dino7.png','./dino8.png','./dino9.png','./dino10.png','./dino11.png','./dino12.png','./dino13.png','./dino14.png','./dino15.png','./dino16.png','./dino17.png','./dino18.png','./dino19.png','./dino20.png','./dino21.png','./dino22.png','./dino23.png','./dino24.png'];
let all=[]; SPRITES.forEach(f=>{for(let i=0;i<10;i++) all.push({file:f,x:(i%5)*25,y:Math.floor(i/5)*100})});
let order=[...Array(240).keys()].sort(()=>Math.random()-0.5);
let pos=0,bod=0,jaja=0,nizNet=0,blok=false,mode=localStorage.getItem('dino_mode')||'sab',a,b,tacno;
const dinoImg=document.getElementById('dinoImg'),dinoFallback=document.getElementById('dinoFallback'),zadDiv=document.getElementById('zad'),brojalica=document.getElementById('brojalica'),unosDiv=document.getElementById('unos'),msgDiv=document.getElementById('msg'),scribbleInput=document.getElementById('scribbleInput');
const sabBtn=document.getElementById('sabBtn'),oduBtn=document.getElementById('oduBtn');
let audioCtx=null;
function getAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function unlockAudio(){ try{ const ac=getAudio(); if(ac.state==='suspended') ac.resume(); const o=ac.createOscillator(),g=ac.createGain(); g.gain.value=0; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.01);}catch{} }
document.addEventListener('pointerdown',()=>{ unlockAudio(); });
document.addEventListener('touchstart',()=>{ unlockAudio(); });
function zvukTacno(){ try{ const ac=getAudio(); if(ac.state==='suspended') ac.resume(); const o=ac.createOscillator(),g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=523; g.gain.setValueAtTime(0.4,ac.currentTime); o.frequency.linearRampToValueAtTime(1046,ac.currentTime+0.25); g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+0.35); o.start(); o.stop(ac.currentTime+0.35);}catch{} }
function zvukNetacno(){ try{ const ac=getAudio(); if(ac.state==='suspended') ac.resume(); const o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.connect(g); g.connect(ac.destination); o.frequency.value=200; g.gain.setValueAtTime(0.4,ac.currentTime); o.frequency.linearRampToValueAtTime(60,ac.currentTime+0.4); g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+0.4); o.start(); o.stop(ac.currentTime+0.4);}catch{} }
function updMode(){ if(mode==='sab'){document.body.classList.remove('oduzimanje');sabBtn.classList.add('active');oduBtn.classList.remove('active');document.getElementById('unos').style.borderColor='#2E7D32';document.getElementById('okBtn').style.background='#2E7D32'}else{document.body.classList.add('oduzimanje');oduBtn.classList.add('active');sabBtn.classList.remove('active');document.getElementById('unos').style.borderColor='#C62828';document.getElementById('okBtn').style.background='#C62828'} localStorage.setItem('dino_mode',mode); }
sabBtn.onclick=()=>{unlockAudio(); mode='sab';updMode();novo()}; oduBtn.onclick=()=>{unlockAudio(); mode='odu';updMode();novo()}; updMode();
function showDino(){ const it=all[order[pos]]; const col=it.x/25; const row=it.y/100; dinoImg.style.display='none'; dinoFallback.style.display='none'; const temp=new Image(); temp.onload=()=>{ dinoImg.src=it.file; dinoImg.style.left=`-${col*100}%`; dinoImg.style.top=`-${row*100}%`; dinoImg.style.display='block'; dinoFallback.style.display='none'; }; temp.onerror=()=>{ dinoImg.style.display='none'; dinoFallback.style.display='flex'; }; temp.src=it.file; document.getElementById('kol').textContent=pos+1; }
function novo(){ showDino(); if(mode==='sab'){ a=Math.floor(Math.random()*10)+1; b=Math.floor(Math.random()*(11-a)); tacno=a+b; zadDiv.textContent=`${a} + ${b} = ?`; let html=''; for(let i=0;i<a;i++) html+=`<span onclick="unlockAudio(); this.classList.toggle('counted')">🦕</span>`; html+=`<span class="op">+</span>`; for(let i=0;i<b;i++) html+=`<span onclick="unlockAudio(); this.classList.toggle('counted')">🦖</span>`; brojalica.innerHTML=html; } else { a=Math.floor(Math.random()*10)+1; b=Math.floor(Math.random()*(a+1)); tacno=a-b; zadDiv.textContent=`${a} - ${b} = ?`; let html=''; for(let i=0;i<a;i++){ if(i < a-b) html+=`<span onclick="unlockAudio(); this.classList.toggle('counted')">🦕</span>`; else html+=`<span class="crossed">🦕</span>`; } brojalica.innerHTML=html; } unosDiv.textContent=''; scribbleInput.value=''; msgDiv.textContent=''; clearTimeout(window.dinoTimer); }
scribbleInput.addEventListener('pointerdown',()=>{unlockAudio();});
scribbleInput.addEventListener('input',()=>{
  unlockAudio();
  let v=scribbleInput.value.replace(/[^0-9]/g,'').slice(0,2);
  if(v!==scribbleInput.value) scribbleInput.value=v;
  if(v!==''){
    unosDiv.textContent=v;
    clearTimeout(window.dinoTimer);
    window.dinoTimer=setTimeout(()=>{
      const vv=parseInt(unosDiv.textContent);
      if(!isNaN(vv)) check();
    },1200);
  }
});
document.querySelectorAll('.keypad button[data-v]').forEach(b=> b.onclick=()=>{ unlockAudio(); clearTimeout(window.dinoTimer); if(blok)return; if(unosDiv.textContent.length<2) unosDiv.textContent+=b.dataset.v; scribbleInput.value=unosDiv.textContent; });
document.getElementById('delBtn').onclick=()=>{ unlockAudio(); clearTimeout(window.dinoTimer); unosDiv.textContent=unosDiv.textContent.slice(0,-1); scribbleInput.value=unosDiv.textContent; };
document.getElementById('okBtn').onclick=()=>{ unlockAudio(); clearTimeout(window.dinoTimer); if(scribbleInput.value) unosDiv.textContent=scribbleInput.value; check(); };
function check(){ if(blok)return; const v=parseInt(unosDiv.textContent||scribbleInput.value); if(isNaN(v)) return; clearTimeout(window.dinoTimer); if(v===tacno){ bod++; if(bod%5===0)jaja++; document.getElementById('bod').textContent=bod; document.getElementById('jaja').textContent=jaja; zvukTacno(); msgDiv.textContent='🎉 BRAVO!'; msgDiv.style.color='#2E7D32'; document.getElementById('dinoSprite').classList.add('bounce'); setTimeout(()=>document.getElementById('dinoSprite').classList.remove('bounce'),400); pos++; if(pos>=240) pos=0; nizNet=0; setTimeout(novo,700); } else { nizNet++; if(jaja>0)jaja--; document.getElementById('jaja').textContent=jaja; zvukNetacno(); msgDiv.textContent=`💔 ${v} nije tačno (${nizNet}/3)`; msgDiv.style.color='#C62828'; document.getElementById('dinoSprite').classList.add('shake'); setTimeout(()=>document.getElementById('dinoSprite').classList.remove('shake'),300); if(nizNet>=3){ blok=true; let t=10; const it=setInterval(()=>{ msgDiv.innerHTML=`⏳ Sačekaj ${t}s...<br><span style="color:#C62828;font-size:18px">${a} ${mode==='sab'?'+':'-'} ${b} = ${tacno}</span>`; t--; if(t<0){clearInterval(it);blok=false;nizNet=0;pos++;if(pos>=240)pos=0;novo();} },1000); } } unosDiv.textContent=''; scribbleInput.value=''; }
novo();
</script>
</body>
</html>
