<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino - iPad Scribble</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system}
body{background:#A5D6A7;display:flex;justify-content:center;min-height:100dvh}
body.oduzimanje{background:#FFCDD2}
#app{width:100%;max-width:440px;background:#fff;margin:8px;border-radius:24px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.15)}
.top{display:flex;gap:8px;padding:12px} .top button{flex:1;padding:14px;border-radius:14px;border:0;font-weight:900} .active{color:#fff} #sabBtn.active{background:#2E7D32} #oduBtn.active{background:#C62828} #sabBtn,#oduBtn{background:#eee}
.stats{display:flex;justify-content:space-around;font-weight:800;padding:6px}
#dinoSprite{width:170px;height:170px;margin:8px auto;background:#f6f6f6;border-radius:20px;border:3px solid #eee;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;font-size:80px}
#zad{font-size:44px;font-weight:900;text-align:center}
#brojalica{text-align:center;font-size:30px;min-height:36px}
#scribbleBox{margin:12px;border:3px solid #2E7D32;border-radius:18px;padding:12px;background:#F1F8E9;position:relative}
#scribbleBox label{font-weight:800;color:#2E7D32;display:block;margin-bottom:8px}
#scribbleInput{width:100%;height:80px;font-size:48px;font-weight:900;text-align:center;border:3px dashed #90A4AE;border-radius:14px;background:#fff;-webkit-user-modify: read-write-plaintext-only;}
#scribbleHint{font-size:13px;color:#666;text-align:center;margin-top:6px}
#canvasBox{margin:12px;border:2px dashed #B0BEC5;border-radius:16px;background:#fff}
#writeCanvas{width:100%;height:140px;touch-action:none;display:block}
#unosBox{display:flex;justify-content:center;gap:10px;margin:10px} #unos{width:90px;height:62px;border:3px solid #2E7D32;border-radius:14px;text-align:center;font-size:32px;font-weight:900;line-height:56px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.keypad button{height:62px;border-radius:16px;border:0;background:#F1F8E9;font-size:26px;font-weight:800}
#okBtn{background:#2E7D32!important;color:#fff}
</style>
</head>
<body>
<div id="app">
<div class="top"><button id="sabBtn" class="active">➕ SABIRANJE</button><button id="oduBtn">➖ ODUZIMANJE</button></div>
<div class="stats">⭐ <b id="bod">0</b> 🥚 <b id="jaja">0</b> 🦕 <b id="kol">0</b>/240</div>
<div id="dinoSprite">🦕</div>
<div id="zad">3 + 2 = ?</div>
<div id="brojalica"></div>

<!-- OVO JE TRIK - koristi iPad Scribble -->
<div id="scribbleBox">
<label>✏️ Piši olovkom ovdje (iPad prepoznaje sam):</label>
<input id="scribbleInput" type="text" inputmode="numeric" lang="sr" placeholder="Piši 5" autocomplete="off" autocorrect="off" spellcheck="false">
<div id="scribbleHint">Sa Apple Pencil piši direktno u polje - iPad će pretvoriti rukopis u broj automatski. Ako nemaš olovku, kucaj na tastaturi dole.</div>
</div>

<div id="canvasBox"><canvas id="writeCanvas"></canvas></div>

<div id="unosBox"><div id="unos"></div><div id="msg"></div></div>
<div class="keypad">
<button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
<button data-v="4">4</button><button data-v="5">5</button><button data-v="6">6</button>
<button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button>
<button id="delBtn">⌫</button><button data-v="0">0</button><button id="okBtn">OK</button>
<button data-v="10" style="grid-column:span 3;background:#FFF9C4">10</button>
</div>
</div>
<script>
const SPRITES=['./dino1.png','./dino2.png','./dino3.png','./dino4.png','./dino5.png','./dino6.png','./dino7.png','./dino8.png','./dino9.png','./dino10.png','./dino11.png','./dino12.png','./dino13.png','./dino14.png','./dino15.png','./dino16.png','./dino17.png','./dino18.png','./dino19.png','./dino20.png','./dino21.png','./dino22.png','./dino23.png','./dino24.png'];
let all=[]; SPRITES.forEach(f=>{for(let i=0;i<10;i++) all.push({file:f,x:(i%5)*25,y:Math.floor(i/5)*100})});
let order=[...Array(240).keys()].sort(()=>Math.random()-0.5);
let pos=0,bod=0,jaja=0,nizNet=0,blok=false,mode=localStorage.getItem('dino_mode')||'sab',a,b,tacno;
const dinoDiv=document.getElementById('dinoSprite'),zadDiv=document.getElementById('zad'),brojalica=document.getElementById('brojalica'),unosDiv=document.getElementById('unos'),msgDiv=document.getElementById('msg'),scribbleInput=document.getElementById('scribbleInput');
function updMode(){ if(mode==='sab'){document.body.classList.remove('oduzimanje');sabBtn.classList.add('active');oduBtn.classList.remove('active')}else{document.body.classList.add('oduzimanje');oduBtn.classList.add('active');sabBtn.classList.remove('active')} localStorage.setItem('dino_mode',mode); }
sabBtn.onclick=()=>{mode='sab';updMode();novo()}; oduBtn.onclick=()=>{mode='odu';updMode();novo()}; updMode();
function showDino(){ const it=all[order[pos]]; dinoDiv.style.backgroundImage=`url('${it.file}')`; dinoDiv.style.backgroundPosition=`${it.x}% ${it.y}%`; dinoDiv.style.backgroundSize='500% 200%'; const img=new Image(); img.onerror=()=>{dinoDiv.style.backgroundImage='none';dinoDiv.textContent='🦕'}; img.src=it.file; document.getElementById('kol').textContent=pos+1; }
function novo(){ showDino(); if(mode==='sab'){a=Math.floor(Math.random()*5)+1; b=Math.floor(Math.random()*(6-a))+1; tacno=a+b; zadDiv.textContent=`${a} + ${b} = ?`; brojalica.innerHTML='🦕'.repeat(a).split('').map(()=>`<span>🦕</span>`).join('')+'+'+'🦖'.repeat(b).split('').map(()=>`<span>🦖</span>`).join('')} else{a=Math.floor(Math.random()*10)+1; b=Math.floor(Math.random()*a)+1; tacno=a-b; zadDiv.textContent=`${a} - ${b} = ?`; let s='';for(let i=0;i<a;i++)s+=i<a-b?`<span>🦕</span>`:`<span style="opacity:.3;text-decoration:line-through">🦕</span>`; brojalica.innerHTML=s} unosDiv.textContent=''; scribbleInput.value=''; msgDiv.textContent=''; }
 // iPad Scribble - nativno prepoznavanje
 scribbleInput.addEventListener('input',()=>{ let v=scribbleInput.value.replace(/[^0-9]/g,'').slice(0,2); scribbleInput.value=v; if(v!==''){ unosDiv.textContent=v; // auto proveri posle 600ms
  setTimeout(()=>{ if(parseInt(unosDiv.textContent)>=0) check(); },600);
 }});
 // canvas za vezbanje pisanja (ne mora za odgovor)
 const canvas=document.getElementById('writeCanvas'),ctx=canvas.getContext('2d');
 function resize(){ const r=canvas.getBoundingClientRect(); canvas.width=r.width*2; canvas.height=140*2; ctx.scale(2,2); ctx.clearRect(0,0,1000,1000); ctx.strokeStyle='#E3F2FD'; for(let y=35;y<140;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(500,y);ctx.stroke()} }
 resize(); let drawing=false,last=null;
 function getPos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top,p:e.pressure||0}}
 canvas.addEventListener('pointerdown',e=>{drawing=true;last=getPos(e);canvas.setPointerCapture(e.pointerId);});
 canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=getPos(e);ctx.strokeStyle='#111';ctx.lineWidth=Math.max(3,p.p*10+3);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
 canvas.addEventListener('pointerup',()=>{drawing=false;});
 document.querySelectorAll('.keypad button[data-v]').forEach(b=> b.onclick=()=>{ if(blok)return; if(unosDiv.textContent.length<2) unosDiv.textContent+=b.dataset.v; scribbleInput.value=unosDiv.textContent; });
 document.getElementById('delBtn').onclick=()=>{ unosDiv.textContent=unosDiv.textContent.slice(0,-1); scribbleInput.value=unosDiv.textContent; };
 document.getElementById('okBtn').onclick=()=>check();
 function check(){ if(blok)return; const v=parseInt(unosDiv.textContent||scribbleInput.value); if(isNaN(v)) return; if(v===tacno){bod++; if(bod%5===0)jaja++; document.getElementById('bod').textContent=bod; document.getElementById('jaja').textContent=jaja; msgDiv.textContent='🎉 BRAVO!'; msgDiv.style.color='#2E7D32'; pos++; nizNet=0; setTimeout(novo,500);} else{ nizNet++; if(jaja>0)jaja--; document.getElementById('jaja').textContent=jaja; msgDiv.textContent=`💔 ${v} nije tačno (${nizNet}/3)`; msgDiv.style.color='#C62828'; if(nizNet>=3){blok=true; let t=10; const it=setInterval(()=>{msgDiv.innerHTML=`⏳ ${t}s...<br>${a} ${mode==='sab'?'+':'-'} ${b} = ${tacno}`;t--; if(t<0){clearInterval(it);blok=false;nizNet=0;pos++;novo();}},1000);}} unosDiv.textContent=''; scribbleInput.value=''; ctx.clearRect(0,0,1000,1000); resize(); }
novo();
</script>
</body>
</html>
